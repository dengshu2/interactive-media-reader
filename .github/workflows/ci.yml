name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Check dependency lock
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Python tests
        # Run through the synced environment: the suite needs numpy, and the
        # engine import test only means something against real dependencies.
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Syntax checks
        run: |
          python -m py_compile scripts/*.py
          node --check assets/app.js
          bash -n scripts/build.sh
          bash -n scripts/stop.sh
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh
      - name: Validate skill metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("SKILL.md").read_text(encoding="utf-8")
          assert text.startswith("---\n")
          assert "name: interactive-media-reader" in text
          assert "description:" in text
          PY
