name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check dependency lock
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Python tests
        # Run through the synced environment: the suite needs numpy, and the
        # engine import test only means something against real dependencies.
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Syntax checks
        run: |
          python -m py_compile scripts/*.py
          node --check assets/app.js
          bash -n scripts/build.sh
          bash -n scripts/stop.sh
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh
      - name: Validate skill metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("SKILL.md").read_text(encoding="utf-8")
          assert text.startswith("---\n")
          assert "name: interactive-media-reader" in text
          assert "description:" in text
          PY
